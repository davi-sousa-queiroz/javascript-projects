<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Click Counter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="click-counter.css" />
  </head>
  <body class="wall">
    <div class="card">
      <h2 class="eyebrow">TRY IT OUT</h2>
      <h1>Click Counter</h1>
      <div class="wrapper">
        <button class="add control-btn">+</button>
        <button class="subtract control-btn">-</button>
      </div>
      <button class="reset">Reset</button>
      <h3 class="count"></h3>
      <button class="mode reset">Light / Dark Mode</button>
    </div>
    <script src="click-counter.js" defer></script>
  </body>
</html>
