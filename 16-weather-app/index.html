<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App - How's the Weather?</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="heading">
        <svg
          class="heading-icon"
          viewBox="0 0 32 32"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M21.5 23H10a6 6 0 1 1 1.1-11.9A8 8 0 0 1 26 15.5a4 4 0 0 1-4.5 7.5Z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M16 4v2m-8 2 1.4 1.4m13.2 0L24 8.1"
            stroke="#f4b740"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        Weather
      </h1>
      <button
        class="settings-button"
        aria-label="Switch to dark mode"
        aria-pressed="false"
      >
        <svg
          class="moon-icon"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M20.2 15.3A8.5 8.5 0 0 1 8.7 3.8 8.5 8.5 0 1 0 20.2 15.3Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <svg
          class="sun-icon"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <circle
            cx="12"
            cy="12"
            r="4"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <path
            d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </header>

    <main class="main-container">
      <div class="search-container">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle
              cx="10.8"
              cy="10.8"
              r="6.8"
              stroke="currentColor"
              stroke-width="2"
            />
            <path
              d="m16 16 4.2 4.2"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </span>
        <input type="text" placeholder="Search for a city..." />
        <button class="search-button" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle
              cx="10.8"
              cy="10.8"
              r="6.8"
              stroke="currentColor"
              stroke-width="2"
            />
            <path
              d="m16 16 4.2 4.2"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>

      <div class="weather-container">
        <p class="emoji">🌦️</p>
        <p class="temp">24°C</p>
        <p class="condition">Partly cloudy</p>
        <p class="location">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M19 10.2c0 5-7 11-7 11s-7-6-7-11a7 7 0 1 1 14 0Z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
            <circle
              cx="12"
              cy="10"
              r="2.3"
              stroke="currentColor"
              stroke-width="1.8"
            />
          </svg>
          São Paulo, Brazil
        </p>

        <div class="infos">
          <div class="humidity-box">
            <span aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M12 3.5S5.5 11 5.5 15.2a6.5 6.5 0 0 0 13 0C18.5 11 12 3.5 12 3.5Z"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linejoin="round"
                />
                <path
                  d="M9 15.5a3 3 0 0 0 3 3"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <div>
              <p class="humidity-text">Humidity</p>
              <p class="amount">72%</p>
            </div>
          </div>

          <div class="wind-box">
            <span aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M3 8h13a2.5 2.5 0 1 0-2.4-3.2M3 12h17a2.5 2.5 0 1 1-2.4 3.2M3 16h8"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <div>
              <p class="wind-text">Wind Speed</p>
              <p class="wind">12 km/h</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
