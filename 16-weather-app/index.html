<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App - How's the Weather?</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1 class="heading">⛅️ Weather</h1>
    <div class="search-container">
      <input type="text" placeholder="Search for a city..." />
      <button>🔍</button>
      <div class="weather-container">
        <p class="emoji">🌦️</p>
        <p class="temp">24°C</p>
        <p class="condition">Partly Cloudy</p>
        <p class="location">São Paulo, Brazil</p>
        <div class="infos">
          <div class="humidity-box">
            <p class="humidity-text">Humidity</p>
            <p class="amount">72%</p>
          </div>
          <div class="wind-box">
            <p class="wind-text">Wind Speed</p>
            <p class="wind">12km/h</p>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
