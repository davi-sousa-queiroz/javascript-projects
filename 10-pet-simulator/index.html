<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Sim - Take Care Of Your Pet.</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="game-background">
    <div class="device">
      <div class="title">Pet Sim</div>

      <div class="screen">
        <div class="status-badge">Day <span id="day-val">1</span></div>

        <svg
          class="pet-svg"
          viewBox="0 0 100 100"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M 20 65 Q 15 25 50 25 Q 85 25 80 65 Q 80 80 50 80 Q 20 80 20 65 Z"
            fill="#93c5fd"
            stroke="#1e293b"
            stroke-width="4"
          />
          <circle cx="38" cy="50" r="4" fill="#1e293b" />
          <circle cx="62" cy="50" r="4" fill="#1e293b" />
          <path
            d="M 45 58 Q 50 63 55 58"
            stroke="#1e293b"
            stroke-width="3"
            stroke-linecap="round"
            fill="none"
          />
          <ellipse cx="30" cy="57" rx="4" ry="2" fill="#fca5a5" />
          <ellipse cx="70" cy="57" rx="4" ry="2" fill="#fca5a5" />
        </svg>
      </div>

      <div class="stats-panel">
        <div class="stat-row">
          <span>HUNGER</span>
          <span class="stat-value"><span id="hunger-val">8</span> / 10</span>
        </div>
        <div class="stat-row">
          <span>HAPPY</span>
          <span class="stat-value"><span id="happy-val">5</span> / 10</span>
        </div>
        <div class="stat-row">
          <span>ENERGY</span>
          <span class="stat-value"><span id="energy-val">9</span> / 10</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-feed" id="feed-btn">
          <?xml version="1.0" encoding="utf-8"?><svg
            version="1.1"
            id="Layer_1"
            xmlns="http://www.w3.org/2000/svg"
            xmlns:xlink="http://www.w3.org/1999/xlink"
            x="0px"
            y="0px"
            viewBox="0 0 122.88 115.21"
            style="enable-background: new 0 0 122.88 115.21"
            xml:space="preserve"
          >
            <g>
              <path
                d="M29.03,100.46l20.79-25.21l9.51,12.13L41,110.69C33.98,119.61,20.99,110.21,29.03,100.46L29.03,100.46z M53.31,43.05 c1.98-6.46,1.07-11.98-6.37-20.18L28.76,1c-2.58-3.03-8.66,1.42-6.12,5.09L37.18,24c2.75,3.34-2.36,7.76-5.2,4.32L16.94,9.8 c-2.8-3.21-8.59,1.03-5.66,4.7c4.24,5.1,10.8,13.43,15.04,18.53c2.94,2.99-1.53,7.42-4.43,3.69L6.96,18.32 c-2.19-2.38-5.77-0.9-6.72,1.88c-1.02,2.97,1.49,5.14,3.2,7.34L20.1,49.06c5.17,5.99,10.95,9.54,17.67,7.53 c1.03-0.31,2.29-0.94,3.64-1.77l44.76,57.78c2.41,3.11,7.06,3.44,10.08,0.93l0.69-0.57c3.4-2.83,3.95-8,1.04-11.34L50.58,47.16 C51.96,45.62,52.97,44.16,53.31,43.05L53.31,43.05z M65.98,55.65l7.37-8.94C63.87,23.21,99-8.11,116.03,6.29 C136.72,23.8,105.97,66,84.36,55.57l-8.73,11.09L65.98,55.65L65.98,55.65z"
              />
            </g>
          </svg>
          Feed
        </button>

        <button class="btn btn-play" id="play-btn">
          <svg
            class="btn-svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#1e293b"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M12 3a9 9 0 0 0 0 18" />
          </svg>
          Play
        </button>

        <button class="btn btn-sleep" id="sleep-btn">
          <svg
            class="btn-svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#1e293b"
            stroke-width="2"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          Sleep
        </button>

        <button class="btn btn-next" id="next-btn">Next Day ➔</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
