<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Sim - Take Care Of Your Pet.</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="device">
      <div class="title">Pet Sim</div>

      <div class="screen">
        <div class="status-badge">Day <span id="day-val">1</span></div>

        <svg
          class="pet-svg"
          viewBox="0 0 100 100"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M 20 65 Q 15 25 50 25 Q 85 25 80 65 Q 80 80 50 80 Q 20 80 20 65 Z"
            fill="#93c5fd"
            stroke="#1e293b"
            stroke-width="4"
          />
          <circle cx="38" cy="50" r="4" fill="#1e293b" />
          <circle cx="62" cy="50" r="4" fill="#1e293b" />
          <path
            d="M 45 58 Q 50 63 55 58"
            stroke="#1e293b"
            stroke-width="3"
            stroke-linecap="round"
            fill="none"
          />
          <ellipse cx="30" cy="57" rx="4" ry="2" fill="#fca5a5" />
          <ellipse cx="70" cy="57" rx="4" ry="2" fill="#fca5a5" />
        </svg>
      </div>

      <div class="stats-panel">
        <div class="stat-row">
          <span>HUNGER</span>
          <span class="stat-value"><span id="hunger-val">8</span> / 10</span>
        </div>
        <div class="stat-row">
          <span>HAPPY</span>
          <span class="stat-value"><span id="happy-val">5</span> / 10</span>
        </div>
        <div class="stat-row">
          <span>ENERGY</span>
          <span class="stat-value"><span id="energy-val">9</span> / 10</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-feed" id="feed-btn">
          <svg
            class="btn-svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#1e293b"
            stroke-width="2"
          >
            <path d="M12 2a5 5 0 0 0-5 5v3a5 5 0 0 0 10 0V7a5 5 0 0 0-5-5z" />
            <path d="M19 11v2a7 7 0 0 1-14 0v-2" />
          </svg>
          Feed
        </button>

        <button class="btn btn-play" id="play-btn">
          <svg
            class="btn-svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#1e293b"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M12 3a9 9 0 0 0 0 18" />
          </svg>
          Play
        </button>

        <button class="btn btn-sleep" id="sleep-btn">
          <svg
            class="btn-svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#1e293b"
            stroke-width="2"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          Sleep
        </button>

        <button class="btn btn-next" id="next-btn">Next Day ➔</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
