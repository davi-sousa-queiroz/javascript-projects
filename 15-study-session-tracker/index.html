<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Session Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar">
      <ul>
        <li>
          <a class="link new-session-link" href="#new-session">New Session</a>
        </li>
        <li>
          <a class="link statistics-link" href="#statistics">Statistics</a>
        </li>
        <li>
          <a class="link session-history" href="#session-history"
            >Session History</a
          >
        </li>
      </ul>
    </nav>
    <section class="new-session" id="new-session">
      <div class="session-container">
        <p class="timer">00:00:00</p>
        <p class="label">What are you studying today?</p>
        <input type="text" class="subject-input" />
        <button class="confirm">Confirm</button>
      </div>
    </section>
    <section
      class="statistics hidden"
      id="statistics"
      aria-labelledby="statistics-title"
    >
      <h1 class="statistics-title" id="statistics-title">Study Statistics</h1>
      <div class="statistics-grid">
        <article class="stat-card">
          <h2 class="stat-label">Hours studied</h2>
          <p class="stat-value">
            <span data-stat="hours">0.00</span>
            <span class="stat-unit">hours</span>
          </p>
        </article>
        <article class="stat-card">
          <h2 class="stat-label">Study sessions</h2>
          <p class="stat-value" data-stat="sessions">0</p>
        </article>
        <article class="stat-card">
          <h2 class="stat-label">Longest session</h2>
          <p class="stat-value" data-stat="longest">00:00:00</p>
        </article>
      </div>
    </section>
    <section
      class="session-history-section hidden"
      id="session-history"
      aria-labelledby="session-history-title"
    >
      <h1 class="statistics-title" id="session-history-title">
        Session History
      </h1>
      <p class="history-empty">No study sessions yet.</p>
      <ul class="history-list"></ul>
    </section>
    <script src="script.js"></script>
  </body>
</html>
