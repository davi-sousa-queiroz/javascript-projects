<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Session Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar">
      <ul>
        <li class="link new-session">New Session</li>
        <li class="link statistics-link">Statistics</li>
        <li class="link session-history">Session History</li>
      </ul>
    </nav>
    <div class="session-container">
      <p class="timer">00:00:00</p>
      <p class="label">What are you studying today?</p>
      <input type="text" class="subject-input" />
      <button class="confirm">Confirm</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
